name: Sprint 1 quality gates

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/gradle/gradle/v8.13.0/gradle/wrapper/gradle-wrapper.jar \
            --output android/gradle/wrapper/gradle-wrapper.jar
          echo "81a82aaea5abcc8ff68b3dfcb58b3c3c429378efd98e7433460610fecd7ae45f  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate source
        run: dart run build_runner build --delete-conflicting-outputs
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test with coverage
        run: flutter test --coverage --branch-coverage
      - name: Enforce coverage
        run: dart run ../tools/verify_coverage.dart coverage/lcov.info
      - name: Build debug APK
        run: flutter build apk --debug
