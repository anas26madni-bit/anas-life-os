name: Sprint 2 quality gates

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify dependency lock
        run: git diff --exit-code -- pubspec.lock
      - name: Generate source
        run: dart run build_runner build
      - name: Apply formatting
        run: dart format .
      - name: Commit formatting
        working-directory: .
        run: |
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -u
            git commit -m "Format Sprint 2 source"
            git push origin HEAD:codex/sprint-2-validation
          fi
      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings
      - name: Test with coverage
        run: flutter test --coverage --branch-coverage
      - name: Enforce coverage
        run: dart run ../tools/verify_coverage.dart coverage/lcov.info
      - name: Build debug APK
        run: flutter build apk --debug

  integration:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Bootstrap verified Gradle wrapper
        shell: bash
        run: |
          echo "7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  android/gradle/wrapper/gradle-wrapper.jar" \
            | sha256sum --check
      - name: Resolve dependencies
        run: flutter pub get
      - name: Generate source
        run: dart run build_runner build
      - name: Enable hardware acceleration
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Android 11 integration tests
        uses: reactivecircus/android-emulator-runner@v2.37.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: >-
            -no-window
            -gpu swiftshader_indirect
            -noaudio
            -no-boot-anim
            -no-metrics
            -no-snapshot
            -camera-back none
          script: >-
            cd app &&
            flutter test integration_test
