name: Apply Sprint 1 formatting

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/format-sprint1.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0

      - name: Apply official Dart formatting
        working-directory: app
        run: |
          dart format \
            lib/app/app.dart \
            lib/core/ai/ai_provider.dart \
            lib/core/database/database_foundation_status.dart \
            lib/core/database/database_initializer.dart \
            lib/core/di/injection.dart \
            lib/core/errors/failure.dart \
            lib/core/startup/foundation_page.dart \
            lib/core/startup/startup_controller.dart \
            test/helpers/fakes.dart

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            app/lib/app/app.dart \
            app/lib/core/ai/ai_provider.dart \
            app/lib/core/database/database_foundation_status.dart \
            app/lib/core/database/database_initializer.dart \
            app/lib/core/di/injection.dart \
            app/lib/core/errors/failure.dart \
            app/lib/core/startup/foundation_page.dart \
            app/lib/core/startup/startup_controller.dart \
            app/test/helpers/fakes.dart
          if git diff --cached --quiet; then
            echo "Formatting already clean"
          else
            git commit -m "Apply official Dart formatting"
            git push
          fi
