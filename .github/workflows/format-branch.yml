name: Format development branch

on:
  push:
    branches:
      - "codex/**"
    paths:
      - "app/**/*.dart"
      - "app/**/*.yaml"
      - ".github/workflows/format-branch.yml"

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out development branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Install Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0
          cache: true
      - name: Format Dart source
        working-directory: app
        run: dart format .
      - name: Commit formatting when required
        shell: bash
        run: |
          if git diff --quiet -- app; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          git commit -m "Format Flutter source"
          git push origin HEAD:${GITHUB_REF_NAME}
