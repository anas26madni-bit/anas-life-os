name: anas_life_os
description: Privacy-first offline personal life management for Android.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: 2.32.1
  dynamic_color: ^1.8.1
  flutter_riverpod: ^3.4.1
  get_it: ^8.3.0
  go_router: ^17.3.0
  injectable: ^3.0.0
  intl: ^0.20.2
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: 2.15.1
  drift_dev: 2.32.1
  flutter_lints: ^6.0.0
  go_router_builder: ^4.4.0
  injectable_generator: 3.0.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

hooks:
  user_defines:
    sqlite3:
      source: sqlcipher
